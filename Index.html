<!DOCTYPE html> 
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum DOM dan Event</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1 id="judul">Selamat Datang di Praktikum DOM dan Event</h1>
    <p id="pesan">Belum ada tindakan yang dilakukan</p>
    <button id="tombolAksi" type="button">Klik Saya</button>
    <br><br>
    <!-- Paragraf dengan id teksGaya -->
    <p id="teksGaya">Ini adalah teks contoh untuk latihan mengubah kelas dan gaya CSS menggunakan JavaScript.</p>

    <!-- Tombol dengan id tombolGaya -->
    <button id="tombolGaya">Ubah Gaya</button>
    <br><br>
    <label for = "namaInput">Nama:</label>
    <input type="text" id ="namaInput" maxlength="40">
    <p>Jumlah Karakter: <span id="jumlahKarakter">0</span></p>
    <hr style="border: 1px solid #ccc; margin: 20px 0;">
    <form id="FormPendaftaran" novalidate> 
        <label for="nama">Nama Lengkap</label><br>
        <input id="nama" name="nama" type="text"  maxlength="100"><br><br>
        <label for="email">Email</label><br>
        <input id="email" name="email" type="email"><br><br>
        <label for="usia">Usia</label><br>
        <input id="usia" name="usia" type="number" min="17" max="100"><br><br>
        <button type="submit">Daftar</button>
    </form>
    <p id="pesanForm" aria-live="polite"></p>
    <hr style="border: 1px solid #ccc; margin: 20px 0;">
    <section>
        <h2>Daftar Tugas</h2>
        <label for="inputTugas">Tugas Baru</label><br>
        <input id="inputTugas" type="text">
        <button id="tambahTugas" type="button">Tambah</button>
        <button id="hapusTugas" type="button">Hapus</button>
        <p id="pesanTugas" aria-live="polite"></p>
        <ul id="daftarTugas"></ul>
    </section>
    <hr style="border: 1px solid #cccc; margin: 20px 0;">
    
</body>
</html>
